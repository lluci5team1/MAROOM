spring.application.name=maroom
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

serpapi.api-key=${SERPAPI_KEY}
serpapi.base-url=https://serpapi.com/search.json

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true