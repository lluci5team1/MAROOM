spring.application.name=maroom
spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

serpapi.api-key=${SERPAPI_API_KEY:${SERPAPI_KEY:}}
serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com/search.json}

maroom.embeddings.enabled=${MAROOM_EMBEDDINGS_ENABLED:true}
maroom.embeddings.voyage.api-key=${VOYAGE_API_KEY:}
google.client-id=${GOOGLE_CLIENT_ID}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
